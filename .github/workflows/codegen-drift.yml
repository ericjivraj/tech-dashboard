name: Codegen Drift Check

on:
  pull_request:

jobs:
  check-codegen-drift:
    # NOTE: This job's `name` is used as the required status check context in
    # .github/workflows/enforce-branch-protection.yml. If you rename this job,
    # update CHECK_NAME in that workflow to match, otherwise branch protection
    # will point to a stale (non-existent) context.
    name: Check generated files are in sync with openapi.yaml
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Get pnpm store directory
        shell: bash
        run: echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check for codegen drift
        run: bash scripts/check-codegen-drift.sh
