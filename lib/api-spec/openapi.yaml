openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: Software Department Portfolio Dashboard API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: auth
    description: Authentication and user management
  - name: sprints
    description: Sprint management
  - name: goals
    description: Business goal management
  - name: projects
    description: Project management
  - name: updates
    description: Project updates
  - name: summary
    description: Dashboard summary and analytics
paths:
  /health:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
        "503":
          description: Service unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /auth/me:
    get:
      operationId: getMe
      tags: [auth]
      summary: Get current authenticated user
      responses:
        "200":
          description: Current user info
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthUser"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /sprints:
    get:
      operationId: listSprints
      tags: [sprints]
      summary: List all sprints
      responses:
        "200":
          description: List of sprints
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Sprint"
    post:
      operationId: createSprint
      tags: [sprints]
      summary: Create a sprint (editor only)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateSprintBody"
      responses:
        "201":
          description: Created sprint
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Sprint"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /sprints/{id}:
    patch:
      operationId: updateSprint
      tags: [sprints]
      summary: Update a sprint (editor only)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateSprintBody"
      responses:
        "200":
          description: Updated sprint
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Sprint"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    delete:
      operationId: deleteSprint
      tags: [sprints]
      summary: Delete a sprint (editor only)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /goals:
    get:
      operationId: listGoals
      tags: [goals]
      summary: List all business goals
      responses:
        "200":
          description: List of business goals
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Goal"
    post:
      operationId: createGoal
      tags: [goals]
      summary: Create a business goal (editor only)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateGoalBody"
      responses:
        "201":
          description: Created goal
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Goal"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /goals/{id}:
    patch:
      operationId: updateGoal
      tags: [goals]
      summary: Update a business goal (editor only)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateGoalBody"
      responses:
        "200":
          description: Updated goal
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Goal"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    delete:
      operationId: deleteGoal
      tags: [goals]
      summary: Delete a business goal (editor only)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /projects:
    get:
      operationId: listProjects
      tags: [projects]
      summary: List all projects, optionally filtered by status, team, sponsor, or goalId
      parameters:
        - name: status
          in: query
          required: false
          schema:
            type: ["string", "null"]
            enum: [done, in_progress, up_next, backlog, new_request, null]
        - name: team
          in: query
          required: false
          schema:
            type: ["string", "null"]
        - name: functionName
          in: query
          required: false
          schema:
            type: ["string", "null"]
        - name: goalId
          in: query
          required: false
          schema:
            type: ["integer", "null"]
      responses:
        "200":
          description: List of projects with goal tags
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ProjectWithDetails"
    post:
      operationId: createProject
      tags: [projects]
      summary: Create a project (editor only)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateProjectBody"
      responses:
        "201":
          description: Created project
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectWithDetails"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /projects/{id}:
    get:
      operationId: getProject
      tags: [projects]
      summary: Get a single project with full details
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Project with full details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectWithDetails"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    patch:
      operationId: updateProject
      tags: [projects]
      summary: Update a project (editor only)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateProjectBody"
      responses:
        "200":
          description: Updated project
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectWithDetails"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    delete:
      operationId: deleteProject
      tags: [projects]
      summary: Delete a project (editor only)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /projects/{id}/allocations:
    get:
      operationId: getProjectAllocations
      tags: [projects]
      summary: Get sub-team sprint allocations for a project
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Sub-team sprint allocations
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ProjectSprintAllocation"
        "404":
          description: Project not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    put:
      operationId: upsertProjectAllocations
      tags: [projects]
      summary: Set sub-team sprint allocations for a project (editor only)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpsertProjectAllocationsBody"
      responses:
        "200":
          description: Updated allocations
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ProjectSprintAllocation"
        "404":
          description: Project not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /projects/{projectId}/updates:
    get:
      operationId: listProjectUpdates
      tags: [updates]
      summary: List updates for a project
      parameters:
        - name: projectId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: List of project updates
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ProjectUpdate"
        "404":
          description: Project not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    post:
      operationId: createProjectUpdate
      tags: [updates]
      summary: Post an update for a project (editor only)
      parameters:
        - name: projectId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateProjectUpdateBody"
      responses:
        "201":
          description: Created update
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectUpdate"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Project not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /projects/{projectId}/updates/{updateId}:
    patch:
      operationId: updateProjectUpdate
      tags: [updates]
      summary: Edit a project update (editor only)
      parameters:
        - name: projectId
          in: path
          required: true
          schema:
            type: integer
        - name: updateId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateProjectUpdateBody"
      responses:
        "200":
          description: Updated project update
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectUpdate"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    delete:
      operationId: deleteProjectUpdate
      tags: [updates]
      summary: Delete a project update (editor only)
      parameters:
        - name: projectId
          in: path
          required: true
          schema:
            type: integer
        - name: updateId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /summary:
    get:
      operationId: getDashboardSummary
      tags: [summary]
      summary: Get dashboard summary metrics
      responses:
        "200":
          description: Summary metrics for the dashboard header
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardSummary"

  /projects/timeline:
    get:
      operationId: getProjectsTimeline
      tags: [summary]
      summary: Get all projects with sprint info for the Gantt chart
      responses:
        "200":
          description: Projects with timeline details
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ProjectTimeline"

  /audit-log:
    get:
      operationId: listAuditLog
      tags: [auth]
      summary: Get audit log entries (admin only, last 200)
      responses:
        "200":
          description: Audit log entries
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AuditLogEntry"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
        db:
          type: string
      required:
        - status

    ErrorResponse:
      type: object
      properties:
        error:
          type: string
      required:
        - error

    AuthUser:
      type: object
      properties:
        userId:
          type: ["string", "null"]
        isAuthenticated:
          type: boolean
        isEditor:
          type: boolean
        email:
          type: ["string", "null"]
        firstName:
          type: ["string", "null"]
        lastName:
          type: ["string", "null"]
        role:
          type: ["string", "null"]
          enum: [admin, null]
        team:
          type: ["string", "null"]
      required:
        - isAuthenticated
        - isEditor
        - userId
        - email
        - firstName
        - lastName
        - role
        - team

    AuditLogEntry:
      type: object
      properties:
        id:
          type: integer
        userId:
          type: ["integer", "null"]
        userEmail:
          type: ["string", "null"]
        action:
          type: string
          enum: [create, update, delete]
        entityType:
          type: string
          enum: [project, goal, sprint]
        entityId:
          type: integer
        diff:
          type: ["object", "null"]
          additionalProperties: true
        createdAt:
          type: string
          format: date-time
      required:
        - id
        - userId
        - userEmail
        - action
        - entityType
        - entityId
        - diff
        - createdAt

    Sprint:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        sprintNumber:
          type: integer
        startDate:
          type: string
          format: date
        endDate:
          type: string
          format: date
        createdAt:
          type: string
          format: date-time
      required:
        - id
        - name
        - sprintNumber
        - startDate
        - endDate
        - createdAt

    CreateSprintBody:
      type: object
      properties:
        name:
          type: string
        sprintNumber:
          type: integer
        startDate:
          type: string
          format: date
        endDate:
          type: string
          format: date
      required:
        - name
        - sprintNumber
        - startDate
        - endDate

    UpdateSprintBody:
      type: object
      properties:
        name:
          type: ["string", "null"]
        sprintNumber:
          type: ["integer", "null"]
        startDate:
          type: ["string", "null"]
          format: date
        endDate:
          type: ["string", "null"]
          format: date

    Goal:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        color:
          type: string
        createdAt:
          type: string
          format: date-time
      required:
        - id
        - name
        - color
        - createdAt

    CreateGoalBody:
      type: object
      properties:
        name:
          type: string
        color:
          type: string
      required:
        - name
        - color

    UpdateGoalBody:
      type: object
      properties:
        name:
          type: ["string", "null"]
        color:
          type: ["string", "null"]

    Project:
      type: object
      properties:
        id:
          type: integer
        title:
          type: string
        description:
          type: ["string", "null"]
        functionName:
          type: ["string", "null"]
        team:
          type: ["string", "null"]
        status:
          type: string
          enum: [done, in_progress, up_next, backlog, new_request]
        storyPoints:
          type: ["integer", "null"]
        startDate:
          type: ["string", "null"]
          format: date
        endDate:
          type: ["string", "null"]
          format: date
        sponsor:
          type: ["string", "null"]
        impact:
          type: ["string", "null"]
        sprintId:
          type: ["integer", "null"]
        displayOrder:
          type: integer
        listOrder:
          type: integer
        timelineOrder:
          type: integer
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      required:
        - id
        - title
        - status
        - description
        - functionName
        - team
        - sponsor
        - storyPoints
        - startDate
        - endDate
        - impact
        - sprintId
        - displayOrder
        - listOrder
        - timelineOrder
        - createdAt
        - updatedAt

    ProjectWithDetails:
      allOf:
        - $ref: "#/components/schemas/Project"
        - type: object
          properties:
            goals:
              type: array
              items:
                $ref: "#/components/schemas/Goal"
            latestUpdate:
              type: ["object", "null"]
              properties:
                id:
                  type: integer
                content:
                  type: string
                authorName:
                  type: ["string", "null"]
                blocked:
                  type: boolean
                createdAt:
                  type: string
                  format: date-time
              required:
                - id
                - content
                - authorName
                - blocked
                - createdAt
            sprint:
              type: ["object", "null"]
              properties:
                id:
                  type: integer
                name:
                  type: string
                sprintNumber:
                  type: integer
              required:
                - id
                - name
                - sprintNumber
            sprintAllocations:
              type: array
              items:
                type: object
                properties:
                  sprintId:
                    type: integer
                  percent:
                    type: number
                required:
                  - sprintId
                  - percent
            stageSchedules:
              type: array
              items:
                type: object
                properties:
                  stage:
                    type: string
                    enum: [backlog, up_next, in_progress]
                  startDate:
                    type: string
                  endDate:
                    type: string
                required:
                  - stage
                  - startDate
                  - endDate
          required:
            - goals
            - latestUpdate
            - sprint
            - sprintAllocations
            - stageSchedules

    CreateProjectBody:
      type: object
      properties:
        title:
          type: string
        description:
          type: ["string", "null"]
        functionName:
          type: ["string", "null"]
        team:
          type: ["string", "null"]
        status:
          type: string
          enum: [done, in_progress, up_next, backlog, new_request]
        storyPoints:
          type: ["integer", "null"]
        startDate:
          type: ["string", "null"]
          format: date
        endDate:
          type: ["string", "null"]
          format: date
        sponsor:
          type: ["string", "null"]
        impact:
          type: ["string", "null"]
        sprintId:
          type: ["integer", "null"]
        goalIds:
          type: ["array", "null"]
          items:
            type: integer
      required:
        - title
        - status

    UpdateProjectBody:
      type: object
      properties:
        title:
          type: ["string", "null"]
        description:
          type: ["string", "null"]
        functionName:
          type: ["string", "null"]
        team:
          type: ["string", "null"]
        status:
          type: ["string", "null"]
          enum: [done, in_progress, up_next, backlog, new_request, null]
        storyPoints:
          type: ["integer", "null"]
        startDate:
          type: ["string", "null"]
          format: date
        endDate:
          type: ["string", "null"]
          format: date
        sponsor:
          type: ["string", "null"]
        impact:
          type: ["string", "null"]
        sprintId:
          type: ["integer", "null"]
        displayOrder:
          type: ["integer", "null"]
        listOrder:
          type: ["integer", "null"]
        timelineOrder:
          type: ["integer", "null"]
        goalIds:
          type: ["array", "null"]
          items:
            type: integer
        sprintAllocations:
          type: ["array", "null"]
          items:
            type: object
            properties:
              sprintId:
                type: integer
              percent:
                type: number
            required:
              - sprintId
              - percent
        stageSchedules:
          type: ["array", "null"]
          items:
            type: object
            properties:
              stage:
                type: string
                enum: [backlog, up_next, in_progress]
              startDate:
                type: string
              endDate:
                type: string
            required:
              - stage
              - startDate
              - endDate
        expectedUpdatedAt:
          type: ["string", "null"]
          format: date-time
          description: >-
            Optimistic-concurrency token. The server compares this to the
            project's current updated_at and rejects with 409 if they differ
            (someone else edited the project after the client opened it).
            Optional — if omitted, the PATCH proceeds without the check.

    ProjectUpdate:
      type: object
      properties:
        id:
          type: integer
        projectId:
          type: integer
        content:
          type: string
        authorName:
          type: ["string", "null"]
        blocked:
          type: boolean
        createdAt:
          type: string
          format: date-time
      required:
        - id
        - projectId
        - content
        - authorName
        - blocked
        - createdAt

    CreateProjectUpdateBody:
      type: object
      properties:
        content:
          type: string
        authorName:
          type: ["string", "null"]
        blocked:
          type: boolean
      required:
        - content

    UpdateProjectUpdateBody:
      type: object
      properties:
        content:
          type: string
        blocked:
          type: boolean

    DashboardSummary:
      type: object
      properties:
        totalProjects:
          type: integer
        totalStoryPoints:
          type: integer
        pointsByStatus:
          type: object
          properties:
            done:
