version: "3.9"

services:
  # ── Postgres database ─────────────────────────────────────────────────────
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: portfolio
      POSTGRES_USER: portfolio
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-localpassword}
    volumes:
      - db-data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U portfolio -d portfolio"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ── One-shot migration service ────────────────────────────────────────────
  db-migrate:
    build:
      context: .
      dockerfile: artifacts/api-server/Dockerfile
      target: deps
    working_dir: /app
    command: pnpm --filter @workspace/db run push
    environment:
      DATABASE_URL: postgres://portfolio:${POSTGRES_PASSWORD:-localpassword}@db:5432/portfolio
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  # ── API server (dev mode — tsx watch for hot-reload) ─────────────────────
  #
  # Source files are bind-mounted from the host so that any edit triggers an
  # automatic server restart inside the container via `tsx watch`.
  # Switch `target: dev-server` → `target: production` for a production build.
  api:
    build:
      context: .
      dockerfile: artifacts/api-server/Dockerfile
      target: dev-server
    volumes:
      # Bind-mount the entire repo so host file changes are visible immediately.
      - .:/app
      # Persist the pnpm store across container restarts to speed up installs.
      - pnpm-store:/root/.local/share/pnpm/store
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: development
      PORT: 3000
      DATABASE_URL: postgres://portfolio:${POSTGRES_PASSWORD:-localpassword}@db:5432/portfolio
      CLERK_SECRET_KEY: ${CLERK_SECRET_KEY}
      EDITOR_EMAILS: ${EDITOR_EMAILS}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:5173}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    depends_on:
      db-migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  # ── Frontend dev server (Vite HMR) ───────────────────────────────────────
  web:
    image: node:24-slim
    working_dir: /app
    command: >
      sh -c "corepack enable &&
             corepack prepare pnpm@latest --activate &&
             pnpm install &&
             pnpm --filter @workspace/portfolio-dashboard run dev"
    volumes:
      - .:/app
      - pnpm-store:/root/.local/share/pnpm/store
    ports:
      - "5173:5173"
    environment:
      # Required by vite.config.ts — must match the exposed port above.
      PORT: "5173"
      # Base path for the Vite dev server. Use "/" for local development.
      BASE_PATH: ${BASE_PATH:-/}
      VITE_CLERK_PUBLISHABLE_KEY: ${VITE_CLERK_PUBLISHABLE_KEY}
      VITE_SITE_PASSCODE: ${VITE_SITE_PASSCODE}
      VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:3000}
    depends_on:
      - api

volumes:
  db-data:
  pnpm-store:
