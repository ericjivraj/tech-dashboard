services:
  # ── Postgres database ─────────────────────────────────────────────────────
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: portfolio
      POSTGRES_USER: portfolio
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-localpassword}
    volumes:
      - db-data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U portfolio -d portfolio"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ── One-shot migration service ────────────────────────────────────────────
  #
  # Applies file-based migrations from lib/db/migrations/ to the database. To
  # add a new migration after a schema change, run:
  #     docker compose run --rm --no-deps --entrypoint "" api \
  #       sh -c "pnpm --filter @workspace/db run generate"
  # then commit the generated SQL file and restart the db-migrate service.
  db-migrate:
    build:
      context: .
      dockerfile: docker/Dockerfile
      target: deps
    working_dir: /app
    command: pnpm --filter @workspace/db run migrate
    volumes:
      - .:/app
      - pnpm-store:/root/.local/share/pnpm/store
    environment:
      DATABASE_URL: postgres://portfolio:${POSTGRES_PASSWORD:-localpassword}@db:5432/portfolio
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  # ── API server (dev mode — tsx watch for hot-reload) ─────────────────────
  #
  # Source files are bind-mounted from the host so that any edit triggers an
  # automatic server restart inside the container via `tsx watch`.
  # Switch `target: dev-server` → `target: production` for a production build.
  api:
    build:
      context: .
      dockerfile: docker/Dockerfile
      target: dev-server
    volumes:
      # Bind-mount the entire repo so host file changes are visible immediately.
      - .:/app
      # Persist the pnpm store across container restarts to speed up installs.
      - pnpm-store:/root/.local/share/pnpm/store
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: development
      PORT: 3000
      DATABASE_URL: postgres://portfolio:${POSTGRES_PASSWORD:-localpassword}@db:5432/portfolio
      CLERK_SECRET_KEY: ${CLERK_SECRET_KEY}
      EDITOR_EMAILS: ${EDITOR_EMAILS}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:5173}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000/health',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    depends_on:
      db-migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  # ── Frontend dev server (Vite HMR) ───────────────────────────────────────
  web:
    image: node:24-slim
    # pnpm-workspace.yaml excludes all rollup/esbuild/lightningcss optional
    # deps except linux-x64, so the container must run as linux/amd64. On
    # Apple Silicon this uses Rosetta 2.
    platform: linux/amd64
    working_dir: /app
    command: >
      sh -c "corepack enable &&
             corepack prepare pnpm@latest --activate &&
             pnpm install &&
             pnpm --filter @workspace/tech-dashboard run dev"
    volumes:
      - .:/app
      # Mask host's node_modules folders so container gets its own Linux
      # binaries (e.g. @rollup/rollup-linux-arm64-gnu). Without these, the
      # host's macOS/Windows native modules leak in via the bind mount.
      - web-node-modules:/app/node_modules
      - web-dashboard-node-modules:/app/artifacts/tech-dashboard/node_modules
      - pnpm-store:/root/.local/share/pnpm/store
    ports:
      - "5173:5173"
    environment:
      # Required by vite.config.ts — must match the exposed port above.
      PORT: "5173"
      # Base path for the Vite dev server. Use "/" for local development.
      BASE_PATH: ${BASE_PATH:-/}
      VITE_CLERK_PUBLISHABLE_KEY: ${VITE_CLERK_PUBLISHABLE_KEY}
      VITE_SITE_PASSCODE: ${VITE_SITE_PASSCODE}
      # In the web container, "localhost" is the web container itself. Use the
      # compose service name so Vite's /api proxy reaches the API container.
      VITE_API_BASE_URL: http://api:3000
    depends_on:
      api:
        condition: service_healthy

volumes:
  db-data:
  pnpm-store:
  web-node-modules:
  web-dashboard-node-modules:
